spring.application.name=SD_24_STRIKER_BE
# Khoa bi mat (Cloudinary, VNPay...) dat trong application-local.properties (khong dua len git),
# xem mau o application-local.properties.example. Co the dung bien moi truong thay the.
spring.config.import=optional:classpath:application-local.properties
# Backend Port
server.port=8080
spring.web.resources.static-locations=classpath:/static/
# Database Configuration
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=Database_STRIKER_Final;encrypt=true;trustServerCertificate=true;
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# JPA Configuration
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Tat tu khoi dong lai cua devtools: IDE bien dich lai mot phan target/classes lam backend sap giua chung
spring.devtools.restart.enabled=false

# Tu dong xoa hoa don cho tai quay (cron Spring: giay phut gio ngay thang thu). Mac dinh 0h00 hang ngay.
app.hoa-don-cho.xoa-cron=0 0 0 * * *
app.hoa-don-cho.zone=Asia/Ho_Chi_Minh

# Phi van chuyen don online: dung API Giao Hang Nhanh neu dien token + shop id,
# neu de trong thi tinh theo bang gia vung (noi tinh / cung mien / khac mien so voi tinh cua hang).
ghn.token=${GHN_TOKEN:}
ghn.shop-id=${GHN_SHOP_ID:}
ghn.from-district-id=${GHN_FROM_DISTRICT_ID:}
app.cua-hang.tinh=Ha Noi
app.phi-van-chuyen.noi-tinh=20000
app.phi-van-chuyen.cung-mien=30000
app.phi-van-chuyen.khac-mien=40000

# Frontend URLs
admin.frontend.url=http://localhost:5173
client.frontend.url=http://localhost:3000

# Cloudinary configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# VNPay sandbox. Thông tin merchant chỉ lấy từ biến môi trường, không commit vào Git.
vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
vnpay.api-url=https://sandbox.vnpayment.vn/merchant_webapi/api/transaction
vnpay.return-url=http://localhost:8080/api/payment/vnpay-return

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.debug=false
mail.enabled=${MAIL_ENABLED:false}
mail.from.address=${MAIL_FROM_ADDRESS:${MAIL_USERNAME:no-reply@striker.local}}
