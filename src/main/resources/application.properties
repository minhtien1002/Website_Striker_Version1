# ============================================================
# MAIL
# ============================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

mail.enabled=${MAIL_ENABLED:false}
mail.from.address=${MAIL_FROM:${MAIL_USERNAME:no-reply@striker.local}}
mail.from.name=Striker Sports Store

# ============================================================
# ACTUATOR
# ============================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true

# ============================================================
# LOGGING
# ============================================================
logging.level.root=INFO
logging.level.com.example.SD_24_STRIKER_BE=DEBUG
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO

# Pattern log có màu
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %clr(%-5level) %clr([%15.15thread]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %msg%n

# ============================================================
# ERROR HANDLING
# ============================================================
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param