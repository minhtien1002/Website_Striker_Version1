# ============================================================
# APPLICATION
# ============================================================
spring.application.name=SD_24_STRIKER_BE
server.port=8080

# ============================================================
# STATIC RESOURCES
# ============================================================
spring.web.resources.static-locations=classpath:/static
spring.web.resources.cache.period=3600

# ============================================================
# DATABASE - SQL Server
# Dùng biến môi trường để không hardcode credentials
# ============================================================
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=Database_STRIKER_Final;encrypt=true;trustServerCertificate=true}
spring.datasource.username=sa
spring.datasource.password=123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Connection pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ============================================================
# JPA / HIBERNATE
# KHÔNG set dialect thủ công - Hibernate 6+ tự detect
# ============================================================
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none

# Timezone - đồng bộ với datetimeoffset trong DB
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

# Batch insert/update (tăng tốc khi seed data)
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ============================================================
# JACKSON (Spring Boot 4 - Jackson 3)
# ============================================================
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ============================================================
# FILE UPLOAD
# ============================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# ============================================================
# FRONTEND URLs
# ============================================================
admin.frontend.url=${ADMIN_FE_URL:http://localhost:5173}
client.frontend.url=${CLIENT_FE_URL:http://localhost:3000}

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# ============================================================
# CLOUDINARY
# ============================================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:dm3ndul0r}
